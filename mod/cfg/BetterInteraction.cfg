# BetterInteraction -- configuration
#
# Edit this file, then restart the game. The mod binds no keys, so there is no
# in-game reload.
# Lines starting with # are comments. Everything is "key = number".
#
# Every feature is independently switchable. 0 always means OFF, or "leave the
# game's own value alone".
#
# Numbers in [square brackets] are what the unmodded game uses, measured on
# this build across two worlds.


# ---------------------------------------------------------------------------
# PAY A WHOLE DEPOSIT IN ONE PRESS.
#
# The game takes a FIXED amount per press: 5 gold at the elevator (total
# 40/60/100), 1 artifact at the gumball machine (total 3), 20 gold at the
# upgrade machine (total 100). This makes one press pay as much of what is still
# owed as you can afford.
#
# The TOTAL you pay is unchanged -- only the number of presses moves. It never
# asks for more than you are holding, so if you cannot cover even one of the
# game's own presses the machine behaves exactly as it always did.
#
# It is sized AT THE MOMENT YOU PRESS, against YOUR wallet, and the game's own
# value is put straight back afterwards. Nothing is left changed on a machine
# you are not using -- so the price shown on a machine is always the real one.
#
# CO-OP: this works for everyone. It runs on the host for whoever pressed the
# button, so a guest pays from their own purse, in one press, wherever the host
# happens to be standing.
#
# 1 = on, 0 = off.
# ---------------------------------------------------------------------------
deposit_all = 1


# ---------------------------------------------------------------------------
# THE GUMBALL MACHINE.   Needs one extra write.
#
# The gumball machine's counter goes down by exactly ONE per press however much
# the deposit charges. So raising the charge on its own does not pay it off
# faster -- it just destroys the difference. (Measured: charged 3 artifacts,
# credited 1.)
#
# With this on, the mod moves the counter to match the charge, so a single press
# stands for as many coins as you can pay for. You pay the same 3 artifacts and
# get the same one gumball. Only the number of presses changes. If you have
# fewer than the machine wants, one press pays what you have and the rest stays
# owed, exactly as it would unmodded.
#
# The charge is written first and read straight back, and put back untouched if
# it will not take. If the counter write is refused, the check that runs after
# the press notices the machine credited less than it charged and switches this
# off for the rest of the session, so it can cost you at most one press on one
# machine.
#
# CO-OP: host/solo only, same as deposit_all above.
#
# 1 = on, 0 = off (the machine then behaves exactly as the base game does).
# ---------------------------------------------------------------------------
deposit_counter = 1


# ---------------------------------------------------------------------------
# ONE COIN INSTEAD OF THIRTY.
#
# The grinder pays out one coin at a time, about every 0.4 seconds, and every
# coin is a separate pickup. There can be dozens.
#
# The amounts look random -- one coin has 3, the next has 10 -- but they are not.
# The payout is BUCKETED: the dispenser puts at most a fixed amount in each coin
# and the small one at the end is the remainder. 10, 10, 10, 3 is a payout of 33
# against a cap of 10.
#
# These two settings ARE that cap. Raise them past any payout and it cannot be
# split, so you get one gold coin and one artifact coin, holding exactly what the
# grinder was going to give you anyway. Same total, one pickup.
#
# Set a smaller number if you would rather have a few coins than one -- 25 gives
# you roughly a third as many as the game does. It cannot go below the game's
# own coin size [5 gold, 1 artifact]. 0 leaves the game's own value completely
# alone, and switching back to 0 actively puts it back rather than just ceasing
# to change it.
#
# CO-OP: host/solo, like the deposits -- and like them, if the HOST runs this
# everyone in the lobby gets the benefit.
# ---------------------------------------------------------------------------
coin_max_gold = 100000
coin_max_artifacts = 100000

# MERGE THE COINS ON THE GROUND INTO ONE.
#
# The two settings above only help WITHIN one grinded item. The grinder pays out
# per item -- grind ten things and you get at least ten coins, however high the
# caps are. That is why a single item worth 34 gold comes out as one coin, but a
# full load comes out as a pile.
#
# With this on, coins lying near you are merged: one gold coin and one artifact
# coin holding the lot. The total is never changed -- the merged coin is written
# and read back FIRST, and the others are only emptied once that is confirmed,
# so a refused write costs you nothing. Emptied coins are hidden rather than
# deleted, and a coin worth zero cannot pay out twice even if the mod is removed
# with its writes still standing.
#
# 1 = on, 0 = off.
coin_merge = 1

# HOW CLOSE TWO COINS MUST BE TO COUNT AS THE SAME PILE, in world units.
#
# Coins are grouped by distance to EACH OTHER, not to you -- so a coin by the
# grinder and one you dropped across the room stay separate, and every merged
# coin ends up inside the pile it came from. For scale, the game lets you
# interact at 150 units and shows a prompt at 300.
#
# Note that this chains: coins 90 units apart, in a line, all end up in one pile
# even if the line is long. The merged coin still sits inside that line.
coin_merge_radius = 100

# HOW MUCH ONE MERGED COIN MAY HOLD.
#
# Putting a whole payout in a SINGLE coin concentrates a risk the game had spread
# out: sixty coins meant losing one cost you 1.6%, one coin means losing it costs
# you everything -- if it clips through the floor or you just do not spot it.
#
# So a pile becomes as many coins as it takes to stay under this, split evenly so
# there is no near-worthless straggler. 310 gold at 100 becomes four coins of 78.
# This is best effort: it can only ever divide the coins that already exist, so
# 1000 gold across three coins gives three of 334.
#
# Lower = safer, more pickups. 0 = no limit, all in one coin. The floor is
# what the game itself puts in one coin [5 gold, 1 artifact]: a number below
# that is raised to it, because splitting finer than the game does helps no
# one. Any number above the floor is yours to pick.
coin_merge_max_gold = 100
coin_merge_max_artifacts = 100

# Seconds between dispensed coins. The game waits about 0.4s per coin, and with
# one coin per grinded item that adds up to a long wait on a full load. 0 leaves
# the game's own timing alone.
coin_dispense_delay = 0.05


# ---------------------------------------------------------------------------
# HOLD TO ATTACK.
#
# Every melee swing in the base game is a click; holding the button swings
# once. With this on, holding keeps swinging until you let go -- and with empty
# hands, holding keeps punching. It only ever CONTINUES a swing the game itself
# started: your own press makes the first one, so anything the game refuses
# (dialogue, menus, a holstered weapon, no stamina) is refused exactly as
# before, a single tap is still a single swing, and switching weapons mid-hold
# stops the old chain until you press again.
#
# Each weapon repeats at ITS OWN measured cadence: the fastest a click was ever
# measured to swing it (mallets and knives about 0.4 s, the spike clubs 0.68,
# the broom 0.82, the shield about 1.0, bare hands 0.51). Never faster than
# clicking, because the game does not check this and the mod must. Weapons
# that already repeat on their own, like the saw, are left to the game. An
# item the mod has no measured cadence for is not repeated, and the log names
# it so it can be added.
#
# CO-OP: this runs on YOUR machine, for your key. Every repeated swing is one
# you could have made by clicking, and the host checks it the same way. A
# guest who wants it needs the mod; the host having it does nothing for a
# guest's key.
#
# 1 = on, 0 = off.
# ---------------------------------------------------------------------------
attack_hold = 1

# Seconds between repeated swings. 0 = each weapon's own cadence, above. A
# positive number slows EVERY weapon to at least that; it can never make one
# faster than clicking.
attack_rate = 0


# ---------------------------------------------------------------------------
# HOUSEKEEPING
# ---------------------------------------------------------------------------

# Write a line to BetterInteraction.log whenever the game reverts something the
# mod set. Once per object per world, not once per pass.
log_reverts = 1
